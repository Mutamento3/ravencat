plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.conversationturnruntime'
version = '1.0.0'

android {
  namespace "expo.modules.conversationturnruntime"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  compileOnly "com.facebook.react:react-android"
  implementation "androidx.core:core-ktx:1.13.1"
}
