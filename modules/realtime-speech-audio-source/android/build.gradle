plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

dependencies {
  implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'
  testImplementation 'junit:junit:4.13.2'
}

group = 'expo.modules.realtimespeechaudiosource'
version = '0.1.0'

android {
  namespace "expo.modules.realtimespeechaudiosource"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
