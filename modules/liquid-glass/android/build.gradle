plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.liquidglass'
version = '0.1.0'

android {
  namespace "expo.modules.liquidglass"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.qmdeve.liquidglass:core:1.0.3'
}
