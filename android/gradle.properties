# 项目级 Gradle 配置。

# IDE（例如 Android Studio）中的 Gradle 配置会覆盖本文件。

# 构建环境配置说明：
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Gradle 守护进程的 JVM 参数，主要用于调整内存上限。
# 默认值：-Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# 启用 Gradle 孵化阶段的并行构建；各模块应保持解耦。
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# 项目仅面向 Android 13 及以上设备。
android.minSdkVersion=33

# 使用 AndroidX 包结构，区分系统组件与应用 APK 内组件。
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Release 构建启用 AAPT2 PNG 压缩。
android.enablePngCrunchInReleaseBuilds=true

# 指定默认构建的 CPU 架构，也可通过命令行覆盖：
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# 启用 React Native 新架构，以使用 TurboModules、Fabric 和兼容库。
newArchEnabled=true

# 启用 Hermes JavaScript 引擎；关闭后将改用 JSC。
hermesEnabled=true

# 启用沉浸式边到边显示，仅适用于 ReactActivity。
edgeToEdgeEnabled=true

# 为 React Native Image 启用 GIF 支持，约增加 200 B。
expo.gif.enabled=true
# 启用 WebP 支持，约增加 85 KB。
expo.webp.enabled=true
# 动态 WebP 约增加 3.4 MB，当前不启用。
expo.webp.animated=false

# 启用开发客户端网络检查器。
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# 不使用旧式原生库压缩打包。
expo.useLegacyPackaging=false

# Expo SDK 54 仍读取此兼容配置；SDK 55 将移除它。
expo.edgeToEdgeEnabled=true
